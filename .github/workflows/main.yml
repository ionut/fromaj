steps:
  - uses: actions/checkout@v3

  - name: Setup Node.js
    uses: actions/setup-node@v3
    with:
      node-version: "18"
      cache: "npm"

  - name: Install dependencies
    run: npm ci

  - name: Build application
    run: npm run build

  - name: Install SSH key
    run: |
      mkdir -p ~/.ssh/
      echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

  - name: Deploy to VPS
    run: |
      # Create deployment directory with timestamp
      DEPLOY_DIR="/var/www/fromaj/releases/$(date +%Y%m%d_%H%M%S)"

      # Copy files to VPS
      rsync -avz --delete \
        .next \
        package.json \
        package-lock.json \
        public \
        next.config.mjs \
        ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$DEPLOY_DIR/

      # SSH into VPS and update deployment
      ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
        # Install dependencies
        cd $DEPLOY_DIR
        npm ci --production
        
        # Update symlink
        ln -sfn $DEPLOY_DIR /var/www/fromaj/current
        
        # Restart PM2 process
        pm2 restart fromaj
        
        # Clean old deployments (keep last 5)
        cd /var/www/fromaj/releases
        ls -1dt */ | tail -n +6 | xargs -d '\n' rm -rf --
      "
